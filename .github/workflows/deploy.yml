name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/avaliacoes:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Rede compartilhada (a mesma da intermediaria); cria se nao existir
            docker network create transacoes-net || true

            # Postgres: so cria um container novo se DB_HOST for "postgres".
            # Se voce ja tem um Postgres na EC2 (da intermediaria), use o DB_HOST de antes.
            if [ "${{ secrets.DB_HOST }}" = "postgres" ]; then
              docker start postgres || docker run -d --name postgres \
                --network transacoes-net \
                -e POSTGRES_USER="${{ secrets.DB_USER }}" \
                -e POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                -e POSTGRES_DB="${{ secrets.DB_NAME }}" \
                -v pgdata:/var/lib/postgresql/data \
                postgres:16
            fi

            # Garante que o Postgres existente esta ligado
            docker start ${{ secrets.DB_HOST }} || true
            sleep 5

            # Redis para o cache
            docker start redis || docker run -d --name redis --restart always --network transacoes-net redis:7

            # Garante que o banco do projeto existe no Postgres (ignora erro se ja existir)
            docker exec ${{ secrets.DB_HOST }} psql -U "${{ secrets.DB_USER }}" -c "CREATE DATABASE ${{ secrets.DB_NAME }};" || true

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/avaliacoes:latest
            docker stop avaliacoes || true
            docker rm avaliacoes || true
            docker stop avaliacao-intermed || true
            docker run -d --name avaliacoes \
              --restart always \
              --network transacoes-net \
              -p 8080:8080 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e REDIS_HOST=redis \
              -e TZ=America/Sao_Paulo \
              ${{ secrets.DOCKERHUB_USERNAME }}/avaliacoes:latest
            docker image prune -f