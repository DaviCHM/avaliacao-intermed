spring.application.name=demo

server.port=8080

# ===== Postgres (mesmo padrao da intermediaria) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:demo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===== Auth0 =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-33x3qs157uhfckjg.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://avaliacoes-api

# ===== CORS (front local e Vercel) =====
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}

# ===== Redis (cache) =====
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# ===== Actuator =====
management.endpoints.web.exposure.include=health
