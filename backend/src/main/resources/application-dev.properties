# Profile para rodar local SEM Postgres e SEM Redis (H2 em memoria):
#   IntelliJ: Run Configuration > Active profiles: dev
#   Terminal: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.cache.type=simple
management.health.redis.enabled=false
